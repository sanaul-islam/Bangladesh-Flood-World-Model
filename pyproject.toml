[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bangladesh-flood-world-model"
version = "0.1.0"
description = "Bangladesh flood forecasting and risk-aware evacuation platform"
readme = "README.md"
requires-python = ">=3.11"

# =========================================================
# PRODUCTION / API DEPENDENCIES
# =========================================================
dependencies = [
    "fastapi>=0.115.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "numpy>=2.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.0",
    "pyproj>=3.6.0",
    "shapely>=2.0",
    "uvicorn[standard]>=0.30.0",
    "xarray>=2026.7.0",
    "pyogrio>=0.10.0",
]

# =========================================================
# RESEARCH / TRAINING / DATA-PROCESSING DEPENDENCIES
# =========================================================
[project.optional-dependencies]
research = [
    "cartopy>=0.25.0",
    "cdsapi>=0.7.7",
    "dask>=2026.8.0",
    "earthaccess>=0.17.0",
    "elevation>=1.1.3",
    "geopandas>=1.1.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "networkx>=3.0",
    "netcdf4>=1.7.4",
    "osmium>=4.3.1",
    "osmnx>=2.1.1",
    "pandas>=2.0",
    "pyogrio>=0.10.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rioxarray>=0.19.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "xlrd>=2.0.2",
    "zarr>=3.1.6",
    
]

# =========================================================
# DEVELOPMENT
# =========================================================
[dependency-groups]
dev = [
    "pytest>=8.0",
]

# =========================================================
# PACKAGE BUILD
# =========================================================
[tool.hatch.build.targets.wheel]
packages = ["src/flood_world_model"]

# =========================================================
# PYTEST
# =========================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = [
    "integration: integration tests requiring project artifacts",
]

# =========================================================
# UV
# =========================================================
[tool.uv]
package = true
